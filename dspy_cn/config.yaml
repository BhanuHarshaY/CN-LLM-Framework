# Swap providers/models only in these two blocks.
base_llm:
  provider: ollama
  model: qwen2.5:14b
  temperature: 0.8
  max_tokens: 250

# Cluster: vLLM serving Qwen2.5-7B-Instruct on an Explorer GPU node (see runbook).
# Switched from Qwen3-8B: the pinned vllm==0.6.6 / transformers==4.46.3 env
# (required for this node's CUDA 12.8 driver) predates the qwen3 architecture
# and can't load it. Qwen2.5 has been supported since transformers 4.37.
judge_llm:
  provider: openai_compatible
  model: Qwen/Qwen2.5-7B-Instruct
  api_base: http://localhost:8000/v1
  temperature: 0.0
  max_tokens: 1200
  timeout: 300

# Local smoke-testing via Ollama (was used for development; cluster is now primary):
# judge_llm:
#   provider: ollama
#   model: qwen3:8b
#   temperature: 0.0
#   max_tokens: 1200
#   keep_alive: 30m
#   timeout: 300

# OpenAI example:
# judge_llm:
#   provider: openai
#   model: gpt-4o-mini
#   api_key_env: OPENAI_API_KEY

# Anthropic example:
# judge_llm:
#   provider: anthropic
#   model: claude-sonnet-4-5
#   api_key_env: ANTHROPIC_API_KEY

data:
  train_en_csv: "data/Generate_CN_MultiThreading - Train English.csv"
  train_ta_csv: "data/Generate_CN_MultiThreading - Train Tamil.csv"
  test_en_csv: "data/Generate_CN_MultiThreading - Test English.csv"
  test_ta_csv: "data/Generate_CN_MultiThreading - Test Tamil.csv"

optimization:
  train_sample_size: 180
  num_trials: 5

evaluation:
  max_rows: null
  batch_size: 8
  checkpoint_every_batches: 10
  llm_weight: 0.5
  reward_weight: 0.5
  datasets:
    baseline:
      input_file: "../src/data/Multitarget-CONAN.csv"
      output_file: "../results/multitarget_conan_scores_decimal_qwen2.5-7b.csv"
      summary_file: "../results/multitarget_conan_evaluation_summary_decimal_qwen2.5-7b.csv"
      counter_narrative_column: COUNTER_NARRATIVE
    enhanced:
      input_file: "../src/data/Generate_CN.csv"
      output_file: "../results/generate_cn_scores_decimal_qwen2.5-7b.csv"
      summary_file: "../results/generate_cn_evaluation_summary_decimal_qwen2.5-7b.csv"
      counter_narrative_column: GENERATED_COUNTER_NARRATIVE

output:
  predictions_en: outputs/predictions_en.csv
  predictions_ta: outputs/predictions_ta.csv
